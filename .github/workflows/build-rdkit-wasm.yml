name: Build RDKit molecular minimizer WASM
on:
  workflow_dispatch:
  push:
    branches: [molecular-minimizer-rdkit-wasm]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: mymindstorm/setup-emsdk@v14
        with: {version: '3.1.64'}
      - name: Fetch RDKit and Boost
        run: |
          git clone --depth 1 --branch Release_2025_03 https://github.com/rdkit/rdkit.git /tmp/rdkit
          wget -q https://archives.boost.io/release/1.85.0/source/boost_1_85_0.tar.bz2 -O /tmp/boost.tar.bz2
          tar -xjf /tmp/boost.tar.bz2 -C /tmp
      - name: Configure and build RDKit
        run: |
          mkdir -p /tmp/rdkit-build && cd /tmp/rdkit-build
          emcmake cmake /tmp/rdkit -DBOOST_ROOT=/tmp/boost_1_85_0 -DBoost_NO_SYSTEM_PATHS=ON -DRDK_USE_BOOST_SERIALIZATION=OFF -DRDK_USE_BOOST_IOSTREAMS=OFF -DRDK_BUILD_PYTHON_WRAPPERS=OFF -DRDK_BUILD_CPP_TESTS=OFF -DRDK_BUILD_INCHI_SUPPORT=OFF -DRDK_BUILD_AVALON_SUPPORT=OFF -DRDK_BUILD_COORDGEN_SUPPORT=OFF -DRDK_BUILD_FREESASA_SUPPORT=OFF -DRDK_BUILD_CAIRO_SUPPORT=OFF -DRDK_BUILD_MAEPARSER_SUPPORT=OFF -DRDK_BUILD_DESCRIPTORS3D=OFF -DRDK_BUILD_PUBCHEMSHAPE_SUPPORT=OFF -DRDK_OPTIMIZE_POPCNT=OFF -DRDK_TEST_MULTITHREADED=OFF -DRDK_BUILD_MINIMAL_LIB=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j2
      - name: Build browser force-field module
        env: {RDKIT_SRC: /tmp/rdkit, RDKIT_BUILD: /tmp/rdkit-build}
        run: cd molecular-minimizer/rdkit-wasm && bash build.sh && test -s RDKitFF.js && test -s RDKitFF.wasm
      - name: Validate molecules
        run: |
          cat > /tmp/test.cjs <<'EOF'
          const init=require(process.cwd()+'/molecular-minimizer/rdkit-wasm/RDKitFF.js');(async()=>{const m=await init({locateFile:f=>process.cwd()+'/molecular-minimizer/rdkit-wasm/'+f});for(const [n,s] of [['ethanol','CCO'],['aspirin','CC(=O)Oc1ccccc1C(=O)O'],['caffeine','Cn1c(=O)c2c(ncn2C)n(C)c1=O']]){const r=m.minimize(s,'MMFF94',500,61453);if(!r.ok||!Number.isFinite(r.initialEnergy)||!Number.isFinite(r.finalEnergy)||r.finalEnergy>r.initialEnergy+1e-6||!r.molblock)throw Error(n+' failed');console.log(n,r.forceField,r.initialEnergy,r.finalEnergy,r.deltaEnergy,r.converged)}})().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node /tmp/test.cjs
