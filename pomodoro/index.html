<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>Focus — Pomodoro Timer</title><style>
:root{--bg:#08111f;--panel:#101c2e;--line:#24344b;--text:#f5f7fb;--muted:#94a3b8;--accent:#ff6b4a;--green:#45d09e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#1a3150 0,#08111f 45%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:24px}.app{width:min(100%,720px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:18px;font-weight:750;letter-spacing:.02em}.status{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:7px 11px;border-radius:999px}.card{background:rgba(16,28,46,.88);border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 30px 80px #0006;backdrop-filter:blur(16px)}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#091424;padding:6px;border-radius:14px}.mode{border:0;background:transparent;color:var(--muted);padding:11px 8px;border-radius:10px;font-weight:650;cursor:pointer}.mode.active{background:#1c2c43;color:#fff}.timer{position:relative;width:310px;height:310px;margin:38px auto 30px;display:grid;place-items:center}.timer svg{position:absolute;inset:0;transform:rotate(-90deg)}circle{fill:none;stroke-width:8}.track{stroke:#203047}.progress{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s linear}.time{text-align:center}.digits{font-size:72px;font-weight:700;letter-spacing:-.05em;font-variant-numeric:tabular-nums;line-height:1}.label{color:var(--muted);margin-top:12px;font-size:14px}.controls{display:flex;justify-content:center;gap:12px}.btn{border:1px solid var(--line);background:#16253a;color:white;border-radius:14px;padding:13px 20px;font-weight:700;cursor:pointer;font-size:15px}.btn.primary{background:var(--accent);border-color:var(--accent);min-width:120px}.btn:hover{filter:brightness(1.08)}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}.metric{border:1px solid var(--line);background:#0b1727;border-radius:16px;padding:16px}.metric span{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.metric strong{font-size:20px}.settings{margin-top:18px;border-top:1px solid var(--line);padding-top:20px;display:flex;gap:12px;align-items:center;justify-content:center;color:var(--muted);font-size:13px}.settings input{width:58px;background:#091424;border:1px solid var(--line);color:#fff;padding:7px;border-radius:8px;text-align:center}@media(max-width:520px){.card{padding:22px}.timer{width:260px;height:260px}.digits{font-size:60px}.bottom{grid-template-columns:1fr}}
</style></head><body><main class="app"><header><div class="brand">FOCUS</div><div class="status" id="clockStatus">Ready to focus</div></header><section class="card"><div class="modes"><button class="mode active" data-mode="focus">Focus</button><button class="mode" data-mode="short">Short Break</button><button class="mode" data-mode="long">Long Break</button></div><div class="timer"><svg viewBox="0 0 310 310"><circle class="track" cx="155" cy="155" r="140"/><circle class="progress" id="ring" cx="155" cy="155" r="140"/></svg><div class="time"><div class="digits" id="display">25:00</div><div class="label" id="phase">Focus session</div></div></div><div class="controls"><button class="btn" id="reset">Reset</button><button class="btn primary" id="start">Start</button><button class="btn" id="skip">Skip</button></div><div class="bottom"><div class="metric"><span>SESSIONS COMPLETED</span><strong id="sessions">0</strong></div><div class="metric"><span>FOCUS TIME TODAY</span><strong id="focusTime">0 min</strong></div></div><div class="settings">Focus <input id="focusSet" type="number" min="1" max="90" value="25"> min · Short <input id="shortSet" type="number" min="1" max="30" value="5"> min · Long <input id="longSet" type="number" min="1" max="60" value="15"> min</div></section></main><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const display=$('#display'),start=$('#start'),ring=$('#ring');const C=2*Math.PI*140;ring.style.strokeDasharray=C;let mode='focus',running=false,timer=null,total=25*60,left=total,sessions=Number(localStorage.pomoSessions||0),today=Number(localStorage.pomoMinutes||0);$('#sessions').textContent=sessions;$('#focusTime').textContent=today+' min';const names={focus:'Focus session',short:'Short break',long:'Long break'};function duration(m){return Number($('#'+(m==='focus'?'focusSet':m==='short'?'shortSet':'longSet')).value)*60}function render(){let m=Math.floor(left/60),s=left%60;display.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;ring.style.strokeDashoffset=C*(1-left/total);document.title=`${display.textContent} — ${names[mode]}`;$('#phase').textContent=names[mode];$('#clockStatus').textContent=running?'Timer running':'Ready to focus'}function setMode(m){clearInterval(timer);running=false;mode=m;total=duration(m);left=total;start.textContent='Start';$$('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));render()}function done(){clearInterval(timer);running=false;if(mode==='focus'){sessions++;today+=Math.round(total/60);localStorage.pomoSessions=sessions;localStorage.pomoMinutes=today;$('#sessions').textContent=sessions;$('#focusTime').textContent=today+' min';beep();setMode(sessions%4===0?'long':'short')}else{beep();setMode('focus')}}function beep(){try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=660;g.gain.value=.08;o.start();o.stop(a.currentTime+.22)}catch(e){}}function toggle(){if(running){clearInterval(timer);running=false;start.textContent='Resume'}else{running=true;start.textContent='Pause';let target=Date.now()+left*1000;timer=setInterval(()=>{left=Math.max(0,Math.ceil((target-Date.now())/1000));render();if(left<=0)done()},250)}render()}start.onclick=toggle;$('#reset').onclick=()=>setMode(mode);$('#skip').onclick=done;$$('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$$('.settings input').forEach(i=>i.onchange=()=>{if(!running)setMode(mode)});document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();toggle()}});render();
</script></body></html>
