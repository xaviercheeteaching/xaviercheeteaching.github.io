<!doctype html><meta charset="utf-8"><title>RDKitFF WP2-4 validation</title><style>body{font:14px system-ui;max-width:900px;margin:40px auto;padding:0 20px}pre{background:#111827;color:#e5e7eb;padding:20px;border-radius:12px;white-space:pre-wrap}.pass{color:#16a34a}.fail{color:#dc2626}</style><h1>RDKitFF WP2–WP4 validation</h1><p>This page validates engine loading, genuine ETKDGv3 3D coordinates, and force-field parameter availability. It deliberately does not claim minimization (WP5).</p><pre id="out">Starting…</pre><script src="../rdkit-wasm/RDKitFF.js"></script><script type="module">import {chemistry} from '../js/chemistry.js';const out=document.querySelector('#out');const tests=[['ethanol','CCO'],['aspirin','CC(=O)Oc1ccccc1C(=O)O'],['ibuprofen','CC(C)Cc1ccc(cc1)[C@@H](C)C(=O)O'],['caffeine','Cn1c(=O)c2c(ncn2C)n(C)c1=O']];function log(s){out.textContent+=s+'\n'};out.textContent='';try{await chemistry.init();log('PASS WP2: custom RDKitFF WASM loaded');for(const [name,s] of tests){const d=chemistry.inspect3D(s);const ok=d.is3D&&d.zSpan>0.05;log(`${ok?'PASS':'FAIL'} WP3 ${name}: is3D=${d.is3D}, zSpan=${Number(d.zSpan).toFixed(4)} Å`);const ff=chemistry.probeForceFields(s);log(`WP4 ${name}: MMFF94=${ff.MMFF94.supported}, MMFF94s=${ff.MMFF94s.supported}, UFF=${ff.UFF.supported}`)}}catch(e){log('FAIL: '+e.message);log('Expected until RDKitFF.js/.wasm have been compiled by the build workflow.');}</script>
